<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda - Agregar Contacto</title>
</head>
<body>
    <h1>Agregar Contacto</h1>
    
    <form th:action="@{/guardar}" th:object="${agenda}" method="post">
        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" required="required" />
        <br/><br/>
        
        <label>Teléfono:</label>
        <input type="text" th:field="*{telefono}" required="required" />
        <br/><br/>
        
        <button type="submit">Guardar</button>
    </form>
    
    <br/>
    <a th:href="@{/listar}">Ver Agenda</a>
</body>
</html>
