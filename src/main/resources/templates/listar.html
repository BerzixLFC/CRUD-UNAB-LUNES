<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Contactos</title>
</head>
<body>
    <h1>Lista de Contactos</h1>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ag : ${agendas}">
                <td th:text="${ag.id}"></td>
                <td th:text="${ag.nombre}"></td>
                <td th:text="${ag.telefono}"></td>
            </tr>
        </tbody>
    </table>
    
    <br/>
    <a th:href="@{/}">Agregar nuevo contacto</a>
</body>
</html>
